name: GitHub Metrics
on:
  # Schedule updates daily at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:
  # Run automatically on pushes to the main branch
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core setup
          user: ${{ github.repository_owner }}
          template: classic
          base: header
          
          # Enable the languages plugin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, lines

          # Ignore Greyhawk Vault which adds disproportionate amount of Markdown and HTML lines
          plugin_languages_skipped: ibinfelix/GreyhawkVault
          plugin_languages_ignored: tex, latex, markdown
          
          # Enable indepth mode to analyze actual commit diffs across orgs
          plugin_languages_indepth: yes
          
          # IMPORTANT: Replace these with the actual Git names or emails you use
          commits_authoring: ibinfelix, sabfems@gmail.com
